set -g mouse on
set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 10
set -g focus-events on

# Better split keys.
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Vim-like pane navigation.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Simple readable status line.
set -g status-style fg=colour252,bg=colour236
set -g status-left-length 30
set -g status-right-length 80
set -g status-left "#[bold]#S#[default] "
set -g status-right "#{?client_prefix,#[fg=colour214]PREFIX ,}#[fg=colour244]%Y-%m-%d #[fg=colour252]%H:%M"
setw -g window-status-current-format "#[bold] #I:#W "
setw -g window-status-format " #I:#W "
